<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGRIS AI Assistant</title>
    <!-- Mobile App Settings -->
    <meta name="theme-color" content="#020813">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #020813;
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }
        /* Top Header */
        header { text-align: center; margin-top: 15px; }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #00e5ff;
        }
        .status {
            font-size: 0.85rem;
            color: #4df;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        /* Glowing Arc Reactor Core */
        .core-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed #00e5ff;
            animation: spin 15s linear infinite;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }
        .core {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00e5ff 60%, transparent 100%);
            box-shadow: 0 0 40px #00e5ff, inset 0 0 20px #00e5ff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .core:active { transform: scale(0.95); }
        .pulsing { animation: pulse 1.2s infinite alternate; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.1); filter: brightness(1.5); } }

        /* Output Terminal */
        .terminal {
            width: 100%;
            max-width: 480px;
            background: rgba(4, 20, 36, 0.85);
            border: 1px solid #00e5ff55;
            border-radius: 12px;
            padding: 16px;
            min-height: 140px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #d1f7ff;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.15);
        }

        /* Controls */
        .controls {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #00e5ff77;
            background: #061527;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #020813;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        button:active { background: #00b0cc; }
        .mic-btn {
            background: transparent;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ IGRIS</h1>
        <div class="status" id="statusText">SYSTEM ONLINE // SECURE</div>
    </header>

    <div class="core-container">
        <div class="ring"></div>
        <div class="core" id="reactorCore" onclick="toggleVoice()"></div>
    </div>

    <div class="terminal" id="outputTerminal">
        [IGRIS]: System ready. Tap the Core or Mic button to talk, or type your command below.
    </div>

    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️ TAP TO TALK</button>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Ask IGRIS anything..." onkeydown="if(event.key==='Enter') executeCommand()">
            <button onclick="executeCommand()">SEND</button>
        </div>
    </div>

    <script>
        // API KEY & SYSTEM PROMPT
        let API_KEY = localStorage.getItem("GEMINI_KEY") || "";
        const terminal = document.getElementById("outputTerminal");
        const statusText = document.getElementById("statusText");
        const reactorCore = document.getElementById("reactorCore");
        const micBtn = document.getElementById("micBtn");

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                statusText.innerText = "LISTENING...";
                reactorCore.classList.add("pulsing");
                micBtn.innerText = "🛑 LISTENING... TAP TO STOP";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById("userInput").value = text;
                executeCommand();
            };

            recognition.onend = () => {
                isListening = false;
                statusText.innerText = "STANDBY";
                reactorCore.classList.remove("pulsing");
                micBtn.innerText = "🎙️ TAP TO TALK";
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Chrome.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Voice Output (Speech Synthesis)
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Execute Command with Gemini
        async function executeCommand() {
            const input = document.getElementById("userInput");
            const query = input.value.trim();
            if (!query) return;

            input.value = "";
            terminal.innerHTML += `<br><br><span style="color:#00ff88;">[User]:</span> ${query}`;
            terminal.scrollTop = terminal.scrollHeight;
            statusText.innerText = "ANALYZING INTEL...";

            // Check if API Key is configured
            if (!API_KEY) {
                const userKey = prompt("Please enter your free Gemini API Key once to activate IGRIS:");
                if (userKey) {
                    API_KEY = userKey.trim();
                    localStorage.setItem("GEMINI_KEY", API_KEY);
                } else {
                    terminal.innerHTML += `<br><span style="color:#ff4d4d;">[Error]: Gemini API key required.</span>`;
                    return;
                }
            }

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
                const payload = {
                    contents: [{
                        parts: [{
                            text: `You are IGRIS, an advanced JARVIS-style personal AI assistant. Keep responses polite, futuristic, concise, and within 2 sentences. User query: ${query}`
                        }]
                    }]
                };

                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text.trim();
                    terminal.innerHTML += `<br><br><span style="color:#00e5ff;">[IGRIS]:</span> ${reply}`;
                    terminal.scrollTop = terminal.scrollHeight;
                    speak(reply);
                } else {
                    terminal.innerHTML += `<br><span style="color:#ff4d4d;">[IGRIS]: Invalid response or API Key error.</span>`;
                }
            } catch (err) {
                terminal.innerHTML += `<br><span style="color:#ff4d4d;">[Error]: ${err.message}</span>`;
            } finally {
                statusText.innerText = "STANDBY";
            }
        }
    </script>
</body>
</html>
